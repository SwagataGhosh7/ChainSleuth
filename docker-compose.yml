version: '3.8'

services:
  # DigitalOcean / Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chainsleuth_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-chainsleuth}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doadmin -d chainsleuth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js + Express Backend Forensics Engine
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chainsleuth_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://doadmin:secretpassword@postgres:5432/chainsleuth
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TINKER_API_KEY=${TINKER_API_KEY}
      - TINKER_API_URL=${TINKER_API_URL:-https://api.tinker.ai/v1}
      - BACKBOARD_API_KEY=${BACKBOARD_API_KEY}
      - BACKBOARD_API_URL=${BACKBOARD_API_URL:-https://api.backboard.ai/v1}
      - POLYGONSCAN_API_KEY=${POLYGONSCAN_API_KEY}
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  # React + Vite Frontend Intelligence Dashboard
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: chainsleuth_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
